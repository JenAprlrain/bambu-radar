name: Update Morning 3D Printing News

on:
  schedule:
    # 6:17 AM EDT daily (10:17 UTC) - offset minute avoids GitHub runner queues
    - cron: '17 10 * * *'
  workflow_dispatch:      # Retains manual 'Run workflow' button

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Run news scraper
        run: |
          rm -f news.json
          python -u fetch_news.py

      - name: Verify and Commit news.json
        run: |
          echo "=== 1. Checking generated file ==="
          ls -la news.json
          head -n 5 news.json

          echo "=== 2. Staging news.json ==="
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f news.json
          git status

          echo "=== 3. Committing and Pushing ==="
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-update morning radar data [skip ci]"
            git push
            echo "Successfully committed and pushed news.json!"
          else
            echo "No changes detected between newly generated news.json and repo."
          fi