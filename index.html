<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bambu Lab Radar | X2D Pro & H3C Launch Watch</title>
  <style>
    :root {
      --bg: #090d12;
      --card-bg: #121820;
      --card-border: #1f2937;
      --card-hover: #2b394a;
      --bambu-green: #00ae42;
      --bambu-glow: rgba(0, 174, 66, 0.25);
      --bambu-amber: #f59e0b;
      --text-main: #f9fafb;
      --text-sub: #9ca3af;
      --text-dim: #6b7280;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding: 24px;
      min-height: 100vh;
    }

    .container { max-width: 1080px; margin: 0 auto; }

    /* PRE-ORDER BANNER */
    .preorder-alert-banner {
      display: none;
      background: linear-gradient(90deg, #14532d 0%, #16a34a 100%);
      border: 2px solid var(--bambu-green);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      box-shadow: 0 0 25px var(--bambu-glow);
      animation: pulseAlert 2.5s infinite;
    }
    .preorder-alert-banner.active { display: flex; align-items: center; justify-content: space-between; }
    .alert-left { display: flex; align-items: center; gap: 14px; }
    .alert-icon { font-size: 2rem; }
    .alert-title { font-size: 1.15rem; font-weight: 800; color: #fff; text-transform: uppercase; }
    .alert-desc { font-size: 0.88rem; color: #dcfce7; }
    .alert-btn {
      background: #fff;
      color: #14532d;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      white-space: nowrap;
      transition: transform 0.15s ease;
    }
    .alert-btn:hover { transform: scale(1.05); }

    @keyframes pulseAlert {
      0%, 100% { box-shadow: 0 0 15px rgba(0, 174, 66, 0.4); }
      50% { box-shadow: 0 0 30px rgba(0, 174, 66, 0.85); }
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 18px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .logo-area h1 { font-size: 1.85rem; font-weight: 800; letter-spacing: -0.5px; }
    .logo-area h1 span { color: var(--bambu-green); }
    .status-sub { color: var(--text-sub); font-size: 0.88rem; margin-top: 4px; }
    .header-controls { display: flex; align-items: center; gap: 12px; }
    .sim-toggle {
      background: #1e2633;
      border: 1px solid #334155;
      color: var(--text-sub);
      font-size: 0.75rem;
      padding: 6px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .sim-toggle input { accent-color: var(--bambu-green); }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* HARDWARE CARDS */
    .grid-duo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
      gap: 18px;
      margin-bottom: 30px;
    }
    @media (max-width: 580px) {
      .grid-duo { grid-template-columns: 1fr; }
    }

    .printer-hero-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 22px;
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .printer-hero-card:hover { border-color: var(--card-hover); }
    .printer-hero-card.live-order {
      border-color: var(--bambu-green);
      box-shadow: 0 0 22px var(--bambu-glow);
    }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .model-badge {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .badge-x2d { background: rgba(0, 174, 66, 0.15); color: var(--bambu-green); border: 1px solid rgba(0, 174, 66, 0.35); }
    .badge-h3c { background: rgba(245, 158, 11, 0.15); color: var(--bambu-amber); border: 1px solid rgba(245, 158, 11, 0.35); }

    .status-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      background: #1e293b;
      color: #94a3b8;
    }
    .status-pill.pill-live {
      background: var(--bambu-green);
      color: #fff;
      animation: pulseAlert 2s infinite;
    }

    .printer-name { font-size: 1.5rem; font-weight: 800; margin-bottom: 6px; }
    .printer-desc { font-size: 0.88rem; color: var(--text-sub); margin-bottom: 16px; }

    /* RELEASE PIPELINE STEP TRACKER */
    .pipeline-wrapper {
      margin-bottom: 16px;
      background: #0b0f14;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #1a2332;
    }
    .pipeline-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .pipeline-stage-title { font-weight: 700; color: #cbd5e1; }
    .pipeline-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 6px;
    }
    .pipeline-step {
      height: 6px;
      background: #1f2937;
      border-radius: 3px;
      transition: background 0.3s ease;
    }
    .pipeline-step.active {
      background: var(--bambu-green);
      box-shadow: 0 0 8px var(--bambu-glow);
    }
    .pipeline-labels {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      font-size: 0.68rem;
      color: var(--text-dim);
      text-align: center;
    }
    .pipeline-labels span.highlight { color: #f3f4f6; font-weight: 700; }

    .specs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      background: #0b0f14;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .spec-item { display: flex; flex-direction: column; }
    .spec-label { font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; }
    .spec-value { font-size: 0.88rem; font-weight: 700; color: #e5e7eb; }

    .card-actions { display: flex; gap: 10px; }
    .primary-card-btn {
      flex: 1;
      background: #1e2633;
      border: 1px solid #334155;
      color: var(--text-main);
      padding: 9px 12px;
      border-radius: 6px;
      text-align: center;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.15s;
    }
    .primary-card-btn:hover { background: #334155; }
    .primary-card-btn.btn-active-order {
      background: var(--bambu-green);
      border-color: var(--bambu-green);
      color: #fff;
    }

    /* MAKERWORLD PICKS SECTION */
    .makerworld-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
    }
    .maker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .maker-title { font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .maker-title span { color: var(--bambu-green); }
    .maker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
    }
    .maker-card {
      background: #0b0f14;
      border: 1px solid #1a2332;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .maker-card:hover {
      transform: translateY(-3px);
      border-color: var(--card-hover);
    }
    .maker-img-wrap {
      width: 100%;
      height: 140px;
      background: #1e2633;
      position: relative;
      overflow: hidden;
    }
    .maker-img-wrap img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }
    .maker-badge-overlay {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .maker-info { padding: 12px; display: flex; flex-direction: column; flex: 1; }
    .maker-name { font-size: 0.95rem; font-weight: 700; margin-bottom: 4px; color: #fff; }
    .maker-meta { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 10px; }
    .maker-desc { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 12px; flex: 1; }
    .maker-download-btn {
      background: #1f2937;
      border: 1px solid #374151;
      color: var(--text-main);
      padding: 7px 10px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
      transition: background 0.15s;
    }
    .maker-download-btn:hover { background: #374151; }

    /* NEWS FEED SECTION */
    .feed-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .filter-tabs { display: flex; gap: 8px; }
    .tab-btn {
      background: #121820;
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab-btn.active { background: #1e293b; color: #fff; border-color: #38bdf8; }

    .news-list { display: flex; flex-direction: column; gap: 12px; }
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      transition: border-color 0.2s;
    }
    .news-card:hover { border-color: var(--card-hover); }
    .news-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .news-tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .tag-x2d { background: rgba(0, 174, 66, 0.15); color: var(--bambu-green); }
    .tag-h3c { background: rgba(245, 158, 11, 0.15); color: var(--bambu-amber); }
    .tag-general { background: rgba(156, 163, 175, 0.15); color: var(--text-sub); }
    .news-timestamp { font-size: 0.78rem; color: var(--text-dim); }
    .news-title { font-size: 1.05rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .news-summary { font-size: 0.88rem; color: #cbd5e1; margin-bottom: 10px; }
    .news-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #1a2332; padding-top: 8px; font-size: 0.8rem; }
    .news-source { color: var(--text-dim); }
    .read-btn { color: var(--bambu-green); text-decoration: none; font-weight: 600; }
    .read-btn:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">

    <!-- URGENT PRE-ORDER ALERT BANNER -->
    <div id="preorderBanner" class="preorder-alert-banner">
      <div class="alert-left">
        <span class="alert-icon">⚡</span>
        <div>
          <div class="alert-title" id="alertTitleText">PRE-ORDER DETECTED!</div>
          <div class="alert-desc" id="alertDescText">Official store listings or order
