<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bambu Lab Next-Gen Radar</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --accent: #00ae42;
      --accent-glow: rgba(0, 174, 66, 0.2);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --badge-leak: #d29922;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      padding: 24px;
    }

    .container { max-width: 900px; margin: 0 auto; }
    header { margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
    h1 span { color: var(--accent); }
    .update-subtext { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

    .news-grid { display: flex; flex-direction: column; gap: 16px; margin-top: 20px; }
    .news-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      transition: border-color 0.2s ease;
    }
    .news-card:hover { border-color: var(--accent); }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-general { background: rgba(0, 174, 66, 0.15); color: #2ea043; border: 1px solid rgba(0, 174, 66, 0.3); }
    .badge-leak { background: rgba(210, 153, 34, 0.15); color: #e3b341; border: 1px solid rgba(210, 153, 34, 0.3); }

    .news-date { font-size: 0.8rem; color: var(--text-muted); }
    .news-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 8px; color: #fff; }
    .news-summary { font-size: 0.95rem; color: #c9d1d9; margin-bottom: 14px; }

    .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #21262d; pt: 10px; margin-top: 8px; }
    .news-source { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }
    .read-link { color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    .read-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><span>⚡</span> Bambu Lab Next-Gen Radar</h1>
      <p id="lastUpdatedTime" class="update-subtext">Loading daily report...</p>
    </header>

    <div id="newsFeedContainer" class="news-grid">
      <p style="color: var(--text-muted);">Fetching morning articles from news.json...</p>
    </div>
  </div>

  <script>
    async function loadDailyNews() {
      const container = document.getElementById('newsFeedContainer');
      const lastUpdatedEl = document.getElementById('lastUpdatedTime');

      try {
        const res = await fetch('./news.json');
        if (!res.ok) throw new Error('news.json not found');

        const data = await res.json();

        if (lastUpdatedEl && data.last_updated) {
          lastUpdatedEl.textContent = `Auto-refreshed: ${data.last_updated}`;
        }

        if (data.articles && data.articles.length > 0) {
          container.innerHTML = '';
          data.articles.forEach(item => {
            const card = document.createElement('article');
            card.className = 'news-card';
            
            const isLeak = item.category.toLowerCase().includes('leak') || item.category.toLowerCase().includes('speculation');
            const badgeClass = isLeak ? 'badge-leak' : 'badge-general';

            card.innerHTML = `
              <div class="card-header">
                <span class="badge ${badgeClass}">${item.category}</span>
                <span class="news-date">${item.timestamp}</span>
              </div>
              <h3 class="news-title">${item.title}</h3>
              <p class="news-summary">${item.summary}</p>
              <div class="card-footer">
                <span class="news-source">${item.source}</span>
                <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="read-link">
                  Read Post &rarr;
                </a>
              </div>
            `;
            container.appendChild(card);
          });
        }
      } catch (err) {
        console.warn("Could not load news.json:", err);
      }
    }

    document.addEventListener('DOMContentLoaded', loadDailyNews);
  </script>
</body>
</html>
